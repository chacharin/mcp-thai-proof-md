# mcp-thai-proofread
# - MCP endpoint http://mcp-thai-proofread:8800/mcp for agents on the same docker network
#   (${DOCKER_NETWORK}, default agent_network - create it once: docker network create agent_network)
# - publishes on ${PUBLISH_ADDR}:${PUBLISH_PORT} (default 0.0.0.0:8805 = reachable from other machines);
#   set MCP_AUTH_TOKEN in .env so callers must present a token
# - this file alone mounts no workspace: proofread_thai reads and writes the agent's files over HTTP through
#   the Hermes dashboard (HERMES_DASHBOARD_URL / _USER / _PASSWORD), so the server can run on any host.
#   On the same host as the agent, add docker-compose.same-host.yml to use the folder directly
#   (set COMPOSE_FILE in .env so a plain `docker compose up -d` uses both).
# - ./prompts is mounted read-only: SYSTEM_PROMPT_FILE in .env may point at a file there
# Every ${…} below is set in .env; the defaults here are generic, not tied to any one deployment.
services:
  mcp-thai-proofread:
    build: .
    image: mcp-thai-proofread:dev
    container_name: mcp-thai-proofread
    env_file: .env
    # uid/gid the container runs as - with a mounted workspace, match its owner so files stay writable for both
    user: "${RUN_UID:-1000}:${RUN_GID:-1000}"
    ports:
      - "${PUBLISH_ADDR:-0.0.0.0}:${PUBLISH_PORT:-8805}:8800"
    volumes:
      - "./prompts:/app/prompts:ro"
      - "usage:/app/usage"          # usage log (tokens and timings of every call), read back through GET /usage
    networks:
      - agent_network
    restart: unless-stopped

volumes:
  usage:

networks:
  agent_network:
    external: true
    name: ${DOCKER_NETWORK:-agent_network}
